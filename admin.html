<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Abbay TV Ethiopia</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="general.css">
    <link rel="icon" href="https://bbjlfleaksumwtimzdim.supabase.co/storage/v1/object/public/image/abbay-logo-gold.png">
    <style>
        /* Admin-specific styles */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            padding: 20px;
        }
        
        .login-container {
            background: var(--dark-gray);
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        
        .login-logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            display: block;
            animation: logoFloat 3s ease-in-out infinite;
        }
        
        .login-form {
            margin-top: 30px;
        }
        
        .admin-dashboard {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="login-screen">
        <div class="login-container">
            <div class="login-header">
                <img src="https://bbjlfleaksumwtimzdim.supabase.co/storage/v1/object/public/image/abbay-logo-gold.png" alt="Abbay TV Logo" class="login-logo">
                <h1 style="text-align: center; color: #d4af37; margin-bottom: 10px;">Admin Dashboard</h1>
                <p style="text-align: center; color: #999; margin-bottom: 30px;">Login to access the admin panel</p>
            </div>
            
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="admin-email">Email Address</label>
                    <input type="email" id="admin-email" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <input type="password" id="admin-password" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px; margin-top: 20px;">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                
                <div id="login-error" style="color: #ef4444; margin-top: 15px; display: none;">
                    Invalid email or password
                </div>
            </form>
            
            <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
                <p style="color: #999; font-size: 0.9rem; text-align: center;">
                    <strong>Default Admin Credentials:</strong><br>
                    Email: eyakemabi@gmail.com<br>
                    Password: @Eyu26042604
                </p>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard (Hidden until login) -->
    <div id="admin-dashboard" class="admin-dashboard">
        <!-- Admin dashboard content will be loaded here after login -->
    </div>

    <script src="main.js"></script>
    <script>
        // Simple admin login
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            
            if (email === 'eyakemabi@gmail.com' && password === '@Eyu26042604') {
                // Store login state
                localStorage.setItem('abbaytv_admin', 'true');
                
                // Show admin dashboard
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                
                // Load admin interface
                loadAdminDashboard();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        });
        
        // Check if already logged in
        if (localStorage.getItem('abbaytv_admin') === 'true') {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-dashboard').style.display = 'block';
            loadAdminDashboard();
        }
        
        function loadAdminDashboard() {
            // Load admin dashboard content
            document.getElementById('admin-dashboard').innerHTML = `
                <div class="top-bar">
                    <div class="top-bar-left">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <i class="fas fa-user-shield" style="color: #d4af37;"></i>
                            <span>Admin Dashboard</span>
                        </div>
                    </div>
                    <div class="top-bar-right">
                        <button onclick="logoutAdmin()" class="btn btn-outline">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </button>
                    </div>
                </div>
                
                <div class="main-content" style="margin-left: 0; margin-top: 70px;">
                    <div class="page-header">
                        <h1><i class="fas fa-tachometer-alt"></i> Admin Dashboard</h1>
                        <p>Manage Abbay TV Ethiopia website content</p>
                    </div>
                    
                    <div class="dashboard-stats">
                        <div class="stat-card">
                            <i class="fas fa-newspaper"></i>
                            <div>
                                <h3 id="total-news">0</h3>
                                <p>News Articles</p>
                            </div>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-film"></i>
                            <div>
                                <h3 id="total-programs">0</h3>
                                <p>TV Programs</p>
                            </div>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-briefcase"></i>
                            <div>
                                <h3 id="total-jobs">0</h3>
                                <p>Job Listings</p>
                            </div>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-envelope"></i>
                            <div>
                                <h3 id="total-messages">0</h3>
                                <p>Messages</p>
                            </div>
                        </div>
                    </div>
                    
                    <div style="background: var(--dark-gray); padding: 30px; border-radius: 10px; margin-top: 30px;">
                        <h2 style="margin-bottom: 20px; color: #d4af37;">Quick Actions</h2>
                        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                            <button onclick="manageContent('news')" class="btn btn-primary">
                                <i class="fas fa-newspaper"></i> Manage News
                            </button>
                            <button onclick="manageContent('programs')" class="btn btn-primary">
                                <i class="fas fa-film"></i> Manage Programs
                            </button>
                            <button onclick="manageContent('jobs')" class="btn btn-primary">
                                <i class="fas fa-briefcase"></i> Manage Jobs
                            </button>
                            <button onclick="manageContent('messages')" class="btn btn-primary">
                                <i class="fas fa-envelope"></i> View Messages
                            </button>
                            <button onclick="updateAnnouncement()" class="btn btn-primary">
                                <i class="fas fa-bullhorn"></i> Update Announcement
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            // Load admin statistics
            loadAdminStatistics();
        }
        
        function logoutAdmin() {
            localStorage.removeItem('abbaytv_admin');
            location.reload();
        }
        
        async function loadAdminStatistics() {
            // This would fetch actual statistics from Supabase
            // For now, we'll set placeholder values
            document.getElementById('total-news').textContent = '12';
            document.getElementById('total-programs').textContent = '8';
            document.getElementById('total-jobs').textContent = '5';
            document.getElementById('total-messages').textContent = '3';
        }
        
        function manageContent(type) {
            alert(`Manage ${type} - This feature would open a full CRUD interface`);
        }
        
        function updateAnnouncement() {
            const message = prompt('Enter new announcement:');
            if (message) {
                alert(`Announcement updated to: "${message}"`);
            }
        }
    </script>
</body>
</html>
